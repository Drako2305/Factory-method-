<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalDocs Solutions - Factory Method UI</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --bg: #f4f7f6; --success: #2ecc71; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .header { text-align: center; margin-bottom: 20px; color: var(--primary); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: var(--secondary); color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        .console { margin-top: 20px; background: #1e1e1e; color: #a9b7c6; padding: 15px; border-radius: 5px; font-family: monospace; font-size: 13px; min-height: 120px; overflow-y: auto; }
        .log-success { color: var(--success); }
        .log-error { color: var(--danger); }
        .log-info { color: #56b6c2; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>GlobalDocs Solutions</h2>
            <p>Batch Processing Engine (Factory Method)</p>
        </div>
        
        <div class="form-group">
            <label>Document Type:</label>
            <select id="docType">
                <option value="Invoice">Electronic Invoice</option>
                <option value="Contract">Legal Contract</option>
                <option value="Report">Financial Report</option>
            </select>
        </div>

        <div class="form-group">
            <label>Country (Regulation):</label>
            <select id="country">
                <option value="Colombia">Colombia</option>
                <option value="Mexico">Mexico</option>
                <option value="Argentina">Argentina</option>
                <option value="Chile">Chile</option>
                <option value="Brazil">Brazil (Unsupported)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Batch Formats:</label>
            <select id="formats" multiple style="height: 90px;">
                <option value=".pdf" selected>.pdf</option>
                <option value=".docx" selected>.docx</option>
                <option value=".xml" selected>.xml</option>
                <option value=".md">.md</option>
                <option value=".xlsx">.xlsx</option>
            </select>
            <small style="color: #777;">Hold Ctrl (Cmd) to select multiple formats</small>
        </div>

        <button onclick="runBatchProcess()">Execute Batch Process</button>

        <div class="console" id="consoleOutput">
            > System ready...
        </div>
    </div>

    <script>
        function runBatchProcess() {
            const output = document.getElementById('consoleOutput');
            const type = document.getElementById('docType').value;
            const country = document.getElementById('country').value;
            const formats = Array.from(document.getElementById('formats').selectedOptions).map(opt => opt.value);
            
            output.innerHTML = `<span class="log-info">> Starting batch for ${country}...</span><br>`;

            const allowedCountries = ["Colombia", "Mexico", "Argentina", "Chile"];
            if (!allowedCountries.includes(country)) {
                output.innerHTML += `<span class="log-error">[CRITICAL ERROR] ${country} is not supported.</span><br>`;
                return;
            }

            formats.forEach(format => {
                let isValid = false;
                if (type === "Invoice" && [".pdf", ".xml", ".csv"].includes(format)) isValid = true;
                if (type === "Contract" && [".doc", ".docx", ".pdf"].includes(format)) isValid = true;
                if (type === "Report" && [".pdf", ".xlsx"].includes(format)) isValid = true;

                if (isValid) {
                    output.innerHTML += `<span class="log-success">[SUCCESS] ${type} processed in ${format}.</span><br>`;
                } else {
                    output.innerHTML += `<span class="log-error">[ERROR] Format ${format} invalid for ${type}.</span><br>`;
                }
            });
        }
    </script>
</body>
</html>
